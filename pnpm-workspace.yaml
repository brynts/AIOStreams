packages:
  - packages/*
allowBuilds:
  '@tailwindcss/oxide': true
  bcrypt: true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  go-ptt: true
  node-datachannel: true
  protobufjs: true
  sharp: true
  sqlite3: true
  unrs-resolver: true
  utf-8-validate: true
  utp-native: true
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - bcrypt
  - better-sqlite3
  - bufferutil
  - esbuild
  - go-ptt
  - node-datachannel
  - protobufjs
  - sharp
  - sqlite3
  - unrs-resolver
  - utf-8-validate
  - utp-native
